<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>NOTAM Reader</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2430; --line:#2a3441;
  --txt:#e6edf3; --dim:#8b98a5;
  --c1:#ff4d4f; --c1bg:#2a1315; --c2:#ffa726; --c2bg:#2a2013; --c3:#8b98a5; --c3bg:#1a1f26;
  --new:#3fb950; --accent:#58a6ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); font-size:17px; line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding:0 0 env(safe-area-inset-bottom);
}
.wrap{max-width:880px;margin:0 auto;padding:0 14px}

header{
  position:sticky;top:0;z-index:20;background:rgba(13,17,23,.94);
  backdrop-filter:saturate(160%) blur(12px);border-bottom:1px solid var(--line);
  padding:env(safe-area-inset-top) 0 0;
}
.hrow{display:flex;align-items:center;gap:10px;padding:12px 14px;max-width:880px;margin:0 auto}
.logo{font-weight:800;font-size:19px;letter-spacing:.5px}
.ver{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.spacer{flex:1}

button,.btn{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:9px 14px;cursor:pointer;transition:.15s}
button:active{transform:scale(.97)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#04121f;font-weight:700}

/* ---- landing ---- */
#drop{padding:0 0 10px}
.hero{text-align:center;padding:46px 8px 26px}
.mark{margin-bottom:16px;filter:drop-shadow(0 6px 20px rgba(88,166,255,.22))}
.wordmark{
  margin:0;font-size:clamp(34px,10vw,52px);line-height:.98;font-weight:800;
  letter-spacing:.14em;direction:ltr;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.wordmark span{display:block;font-weight:400;color:var(--dim);letter-spacing:.34em;
  font-size:.52em;margin-top:10px;padding-inline-start:.34em}
.runway{display:flex;justify-content:center;gap:9px;margin:22px auto 0;max-width:230px}
.runway i{height:3px;flex:1;border-radius:2px;background:var(--line)}
.runway i:nth-child(4){background:var(--accent)}
.tag{margin:20px auto 0;max-width:330px;color:var(--dim);font-size:15.5px;line-height:1.65}

.dropzone{
  margin:8px 0 0;border:1.5px dashed var(--line);border-radius:20px;padding:34px 22px 30px;
  text-align:center;background:linear-gradient(180deg,#161b22,#12171e);transition:.2s}
.dropzone.busy{border-style:solid;border-color:var(--accent)}
.dropzone.over{border-color:var(--accent);background:linear-gradient(180deg,#16263a,#101a26);
  transform:scale(1.01)}
.dz-ico{width:58px;height:58px;margin:0 auto 14px;border-radius:16px;color:var(--accent);
  background:#12203a;border:1px solid #22344d;display:flex;align-items:center;justify-content:center}
.dropzone h2{margin:0 0 5px;font-size:19px;font-weight:700}
.dropzone p{margin:0 0 20px;color:var(--dim);font-size:14.5px}
.btn-primary{padding:12px 30px;font-size:16px;border-radius:12px}
.err{color:var(--c1);margin-top:16px;font-size:15px}

.feats{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;
  margin:14px 0 0;padding:0}
.feats li{background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:14px 9px;text-align:center}
.feats b{display:block;font-size:14px;margin-bottom:4px}
.feats span{display:block;color:var(--dim);font-size:11.5px;line-height:1.4}
@media (max-width:400px){ .feats{grid-template-columns:1fr;} .feats li{display:flex;
  gap:8px;justify-content:center;align-items:baseline;padding:11px} .feats b{margin:0} }

/* ---- controls ---- */
.bar{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:12px 14px;margin:14px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bar .lbl{font-size:13px;color:var(--dim);margin-inline-end:2px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:8px 13px;font-size:14px;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#04121f;font-weight:700}
.seg button+button{border-inline-start:1px solid var(--line)}

.flight{font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums}
.flight b{color:var(--txt)}

/* ---- summary ---- */
.sum{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.pill{border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;border:1px solid}
.p1{color:var(--c1);background:var(--c1bg);border-color:#4d2226}
.p2{color:var(--c2);background:var(--c2bg);border-color:#4d3a1c}
.p3{color:var(--c3);background:var(--c3bg);border-color:var(--line)}
.pn{color:var(--new);background:#13261a;border-color:#1f4429}

/* ---- station groups ---- */
.grp{margin:26px 0 0}
.grp-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  padding:11px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.grp-h .icao{font-size:21px;font-weight:800;letter-spacing:1px}
.grp-h .nm{font-size:13px;color:var(--dim);flex:1;min-width:120px}
.grp-h .role{font-size:12px;color:var(--dim);border:1px solid var(--line);
  border-radius:999px;padding:3px 10px;background:var(--bg)}

/* ---- cards ---- */
.card{border:1px solid var(--line);border-radius:12px;margin:10px 0;overflow:hidden;background:var(--panel)}
.card.t1{border-inline-start:5px solid var(--c1)}
.card.t2{border-inline-start:5px solid var(--c2)}
.card.t3{border-inline-start:5px solid var(--c3)}
.chead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 13px;cursor:pointer}
.card.flat .chead{cursor:default}
.tag{font-size:13px;font-weight:800;padding:4px 11px;border-radius:8px;white-space:nowrap}
.t1 .tag{color:var(--c1);background:var(--c1bg)}
.t2 .tag{color:var(--c2);background:var(--c2bg)}
.t3 .tag{color:var(--c3);background:var(--c3bg)}
.nid{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;direction:ltr}
.badge-new{font-size:11px;font-weight:800;color:#04121f;background:var(--new);
  border-radius:6px;padding:3px 8px;letter-spacing:.4px}
.chead .spc{flex:1}
.chev{color:var(--dim);font-size:13px;transition:.2s}
.card.open .chev{transform:rotate(180deg)}
.gist{padding:0 13px 11px;font-size:16px;line-height:1.5;direction:ltr;text-align:left;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14.5px;
  letter-spacing:.2px;word-break:break-word}
.t1 .gist{color:#ffe3e4;font-weight:600;font-size:15.5px}
.t2 .gist{color:#ffeacd}
.dates{padding:0 13px 11px;font-size:12.5px;color:var(--dim);direction:ltr;text-align:left;
  font-variant-numeric:tabular-nums}
.dates .exp{color:var(--c2)}
.raw{display:none;padding:12px 13px;border-top:1px solid var(--line);background:#0b0f14;
  direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;color:#c9d5e1}
.card.open .raw{display:block}

/* ---- collapsed info group ---- */
.more{width:100%;text-align:center;margin:10px 0;color:var(--dim);font-size:14px;background:transparent;border-style:dashed}
.empty{margin:10px 0;padding:14px;border:1px dashed var(--line);border-radius:12px;
  color:var(--dim);font-size:14px;text-align:center;background:var(--panel)}
.hidden{display:none}
footer{color:var(--dim);font-size:12px;text-align:center;padding:34px 0 24px}
</style>
</head>
<body>

<header id="hdr" class="hidden">
  <div class="hrow">
    <span class="logo">NOTAM Reader</span>
    <span class="ver" id="ver"></span>
    <span class="spacer"></span>
    <button id="reset">קובץ חדש</button>
  </div>
</header>

<div class="wrap">

  <section id="drop">
    <div class="hero">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="58" height="58">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#3fb950"/>
          </linearGradient></defs>
          <rect x="2" y="2" width="60" height="60" rx="16" fill="#111823" stroke="url(#g)" stroke-width="2"/>
          <rect x="14" y="17" width="36" height="5" rx="2.5" fill="#ff4d4f"/>
          <rect x="14" y="29" width="36" height="5" rx="2.5" fill="#ffa726"/>
          <rect x="14" y="41" width="22" height="5" rx="2.5" fill="#5b6976"/>
        </svg>
      </div>
      <h1 class="wordmark">NOTAM<span>READER</span></h1>
      <div class="runway" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <p class="tag">קורא את מקטע ה‑NOTAM מתוך ה‑OFP, מסווג לפי חשיבות<br>ומסנן לחלון הטיסה</p>
    </div>

    <div class="dropzone" id="dz">
      <div class="dz-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
        </svg>
      </div>
      <h2>גרור לכאן את ה‑OFP</h2>
      <p>קובץ PDF — או בחר מהמכשיר</p>
      <button class="btn-primary" id="pick">בחירת קובץ</button>
      <input type="file" id="file" accept="application/pdf,.pdf" hidden>
      <div class="err" id="err"></div>
    </div>

    <ul class="feats">
      <li><b>סיווג</b><span>שלוש רמות חשיבות</span></li>
      <li><b>סינון</b><span>לפי חלון הטיסה</span></li>
      <li><b>Offline</b><span>הקובץ לא עוזב את המכשיר</span></li>
    </ul>
  </section>

  <div id="app" class="hidden">
    <div class="bar">
      <span class="lbl">טיסה</span>
      <span class="seg" id="segFlight"></span>
      <span class="spacer" style="flex:1"></span>
      <span class="flight" id="fInfo"></span>
    </div>

    <div class="bar">
      <span class="lbl">חדש מ‑</span>
      <span class="seg" id="segNew">
        <button data-d="7">7 ימים</button>
        <button data-d="14" aria-pressed="true">14 יום</button>
        <button data-d="30">30 יום</button>
      </span>
      <span class="lbl" style="margin-inline-start:8px">לידיעה</span>
      <span class="seg" id="segInfo">
        <button data-v="1">מוצג</button>
        <button data-v="0" aria-pressed="true">מוסתר</button>
      </span>
      <span class="lbl" style="margin-inline-start:8px">FIR</span>
      <span class="seg" id="segFir">
        <button data-v="1">מוצג</button>
        <button data-v="0" aria-pressed="true">מוסתר</button>
      </span>
    </div>

    <div class="sum" id="sum"></div>
    <div id="list"></div>
  </div>

  <footer id="foot"></footer>
</div>

<script src="pdfload.js"></script>
<script src="parser.js"></script>
<script type="module">
import * as pdfjsLib from './vendor/pdf.min.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdf.worker.min.mjs';
window.pdfjsLib = pdfjsLib;
window.dispatchEvent(new Event('pdfjs-ready'));
</script>
<script src="app.js"></script>
</body>
</html>
