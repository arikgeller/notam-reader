<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b2a3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>(function(){try{var t=localStorage.getItem('fp-theme');
if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>FP Reader</title>
<style>
/* FP Reader — light professional theme.
   The page is the lightest surface; every section sits on it as a darker slab
   with a near-black header bar, so the four parts read as separate documents
   rather than one long list. */
html{color-scheme:light}
:root{
  --bg:#e9eef4; --panel:#ffffff; --panel2:#eef2f7; --panel3:#dfe6ee; --surface:#ffffff;
  --head:#1b2a3a; --head2:#22344a; --headline:#0d1826; --headdim:#9fb5cb;
  --headbtn:#33475e; --headbtnbd:#44596f;
  --line:#b4c2d2; --line2:#9daebf;
  --txt:#14202c; --dim:#5b6c7e; --onhead:#eef4fb; --mono:#243444; --accfg:#0d1a26;
  --tint:#e6f0fb; --tintbd:#bcd6f2;
  --c1:#b3261e; --c1bg:#fdeceb; --c1bd:#e8b4b0;
  --c2:#9a5b00; --c2bg:#fdf3e3; --c2bd:#e8cd9a; --c2fg:#6b3f00;
  --c3:#5b6c7e; --c3bg:#e9eef4;
  --new:#166534; --newbg:#e6f4ea; --newbd:#a8d5b8;
  --accent:#0b5cad;
  --shadow1:rgba(20,34,48,.10); --shadow2:rgba(20,34,48,.16);
  --mapsea:#eef4fa; --mapcoast:#93a8bd;
}
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="dark"] :root, html[data-theme="dark"]{
  --bg:#080c12; --panel:#161d27; --panel2:#1f2833; --panel3:#2a3543; --surface:#1b232e;
  --head:#0e151e; --head2:#16202b; --headline:#000; --headdim:#7b8ea3;
  --headbtn:#28323f; --headbtnbd:#3a4857;
  --line:#2c3846; --line2:#3d4c5c;
  --txt:#e4ebf3; --dim:#8ea0b3; --onhead:#e8eff7; --mono:#c5d3e0; --accfg:#08131d;
  --tint:#14263c; --tintbd:#28425f;
  --c1:#ff7b74; --c1bg:#2c1518; --c1bd:#57282a;
  --c2:#ffb454; --c2bg:#2b2113; --c2bd:#574123; --c2fg:#ffd9a3;
  --c3:#8ea0b3; --c3bg:#212a35;
  --new:#5cd18a; --newbg:#12261a; --newbd:#2b5138;
  --accent:#5aa9ff;
  --shadow1:rgba(0,0,0,.45); --shadow2:rgba(0,0,0,.6);
  --mapsea:#101822; --mapcoast:#465a70;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); font-size:17px; line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding:0 0 env(safe-area-inset-bottom);
}
.wrap{max-width:880px;margin:0 auto;padding:0 14px}

header{
  position:sticky;top:0;z-index:20;background:var(--head);
  border-bottom:1px solid var(--headline);padding:env(safe-area-inset-top) 0 0;
  box-shadow:0 2px 10px var(--shadow1)}
.hrow{display:flex;align-items:center;gap:10px;padding:12px 14px;max-width:880px;margin:0 auto}
.logo{font-weight:800;font-size:19px;letter-spacing:.5px;color:var(--onhead)}
.ver{font-size:11px;color:var(--headdim);font-variant-numeric:tabular-nums}
.spacer{flex:1}
header button{background:var(--headbtn);border-color:var(--headbtnbd);color:var(--onhead)}

button,.btn{font:inherit;color:var(--txt);background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:9px 14px;cursor:pointer;transition:.15s}
button:active{transform:scale(.98)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}

/* ---- landing ---- */
#drop{padding:0 0 10px}
.hero{text-align:center;padding:44px 8px 24px}
.mark{margin-bottom:16px;filter:drop-shadow(0 8px 18px var(--shadow2))}
.wordmark{margin:0;font-size:clamp(34px,10vw,52px);line-height:.98;font-weight:800;
  letter-spacing:.14em;direction:ltr;color:var(--head);
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.wordmark span{display:block;font-weight:400;color:var(--dim);letter-spacing:.34em;
  font-size:.52em;margin-top:10px;padding-inline-start:.34em}
.runway{display:flex;justify-content:center;gap:9px;margin:22px auto 0;max-width:230px}
.runway i{height:3px;flex:1;border-radius:2px;background:var(--line2)}
.runway i:nth-child(4){background:var(--accent)}
.tag{margin:20px auto 0;max-width:330px;color:var(--dim);font-size:15.5px;line-height:1.65}

.dropzone{margin:8px 0 0;border:2px dashed var(--line2);border-radius:18px;padding:34px 22px 30px;
  text-align:center;background:var(--surface);transition:.2s;box-shadow:0 4px 16px var(--shadow1)}
.dropzone.busy{border-style:solid;border-color:var(--accent)}
.dropzone.over{border-color:var(--accent);background:var(--tint)}
.dz-ico{width:58px;height:58px;margin:0 auto 14px;border-radius:16px;color:var(--accent);
  background:var(--tint);border:1px solid var(--tintbd);display:flex;align-items:center;justify-content:center}
.dropzone h2{margin:0 0 5px;font-size:19px;font-weight:700}
.dropzone p{margin:0 0 20px;color:var(--dim);font-size:14.5px}
.btn-primary{padding:12px 30px;font-size:16px;border-radius:11px}
.err{color:var(--c1);margin-top:16px;font-size:15px}
.feats{list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 0;padding:0}
.feats li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 9px;
  text-align:center;box-shadow:0 2px 8px var(--shadow1)}
.feats b{display:block;font-size:14px;margin-bottom:4px}
.feats span{display:block;color:var(--dim);font-size:11.5px;line-height:1.4}
@media (max-width:400px){.feats{grid-template-columns:1fr}.feats li{display:flex;gap:8px;
  justify-content:center;align-items:baseline;padding:11px}.feats b{margin:0}}

/* ---- controls ---- */
.bar{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;
  margin:14px 0;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  box-shadow:0 2px 8px var(--shadow1)}
.bar .lbl{font-size:13px;color:var(--dim)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;padding:8px 13px;font-size:14px;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:700}
.seg button+button{border-inline-start:1px solid var(--line)}
.flight{font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums}

/* ---- sections ---- */
.sec{border:1px solid var(--line2);border-radius:14px;background:var(--panel);
  margin:28px 0;overflow:hidden;box-shadow:0 8px 22px var(--shadow2)}
.sec:first-child{margin-top:14px}
.sec h3{display:flex;align-items:center;gap:11px;margin:0;padding:14px 15px;
  font-size:18px;font-weight:800;letter-spacing:.2px;color:var(--onhead);
  background:linear-gradient(180deg,var(--head2),var(--head));
  border-bottom:4px solid var(--acc)}
.sec h3 .n{width:27px;height:27px;border-radius:8px;background:var(--acc);color:var(--accfg);
  font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.sec h3 .rt{margin-inline-start:auto;font-size:11.5px;color:var(--headdim);font-weight:400;
  text-align:left;line-height:1.35;max-width:52%}
.sec-1{--acc:#4da3ff} .sec-2{--acc:#b48cff} .sec-3{--acc:#2fc9b4} .sec-4{--acc:#ff9f4a}
html[data-theme="dark"] .sec-1{--acc:#67b4ff}
html[data-theme="dark"] .sec-2{--acc:#c4a2ff}
html[data-theme="dark"] .sec-3{--acc:#4bdcc7}
html[data-theme="dark"] .sec-4{--acc:#ffb066}
.none,.clean{margin:0;padding:14px 15px;font-size:14.5px;color:var(--dim)}
.clean{color:var(--new);font-weight:600}

.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;padding:13px 15px;font-size:14.5px}
.facts dt{color:var(--dim);white-space:nowrap;font-size:13px}
.facts dd{margin:0;direction:ltr;text-align:left;word-break:break-word;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px}
.facts dd.bad{color:var(--c1);font-weight:700}
.facts.mono dd{font-size:12.5px}
.facts .fsep{grid-column:1/-1;height:0;margin:10px 0 8px;border-top:2px solid var(--line2)}

.alert{margin:0 15px 12px;padding:11px 13px;border-radius:9px;font-size:14.5px;font-weight:700;line-height:1.45}
.a-fail{background:var(--c1bg);color:var(--c1);border:1px solid var(--c1bd)}
.a-warn{background:var(--c2bg);color:var(--c2);border:1px solid var(--c2bd)}
.hint{margin:9px 0 0;font-size:13px;color:var(--dim);line-height:1.5}
.more-d{margin:0 15px 12px}
.more-d summary{cursor:pointer;color:var(--accent);font-size:13px;padding:4px 0;font-weight:600}
.more-d .facts{padding:8px 0 0}

.mel{padding:13px 15px}
.mel-h{color:var(--c2);font-weight:800;font-size:14.5px;margin-bottom:8px}
.mel-i{direction:ltr;text-align:left;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:12.5px;line-height:1.5;padding:9px 11px;border-radius:8px;background:var(--c2bg);
  border:1px solid var(--c2bd);color:var(--c2fg);margin-bottom:6px;word-break:break-word}

/* weather */
.wx-st{display:flex;align-items:center;gap:9px;padding:11px 15px;border-top:1px solid var(--line)}
.sec h3+.wx-st{border-top:0}
.wx-i{font-size:17px;font-weight:800;letter-spacing:.5px}
.wx-r{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;
  padding:2px 9px;background:var(--panel2)}
.wx-ok{margin-inline-start:auto;color:var(--new);font-size:13.5px;font-weight:600}
.wx-na{margin-inline-start:auto;color:var(--c2);font-size:13px;text-align:left}
.wx-l{list-style:none;margin:0;padding:0 15px 12px}
.wx-l li{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;padding:6px 0;font-size:14.5px;
  direction:ltr;text-align:left}
.wx-tag{font-size:10.5px;font-weight:800;letter-spacing:.4px;color:var(--c2);background:var(--c2bg);
  border:1px solid var(--c2bd);border-radius:5px;padding:2px 7px;white-space:nowrap;flex:none}
.wx-p{color:var(--dim);font-size:12px}
.raw2{margin:8px 0 0;padding:10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);
  direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.5;color:var(--mono)}

/* collapsible secondary enroute fields */
.fold{border-top:1px solid var(--line2)}
.foldbtn{display:flex;align-items:center;gap:9px;width:100%;border:0;border-radius:0;
  background:var(--panel2);padding:12px 15px;font-size:14px;color:var(--txt);text-align:start;font-weight:600}
.foldbtn:hover{background:var(--panel3)}
.fbadge{font-size:11.5px;color:var(--c2);background:var(--c2bg);border:1px solid var(--c2bd);
  border-radius:999px;padding:2px 9px;font-weight:700}
.fchev{margin-inline-start:auto;color:var(--dim);font-size:12px}
.foldbody{display:none}
.fold.open .foldbody{display:block}

/* schematic closure map */
.mapwrap{border-top:1px solid var(--line2)}
.mapbody{display:none;padding:12px 15px 14px;background:var(--panel2)}
.mapwrap.open .mapbody{display:block}
.mapsvg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:9px}
.m-sea{fill:var(--mapsea)}
.m-coast{fill:none;stroke:var(--mapcoast);stroke-width:1.1;stroke-linejoin:round;stroke-linecap:round}
.m-area{fill:var(--c1);fill-opacity:.20;stroke:var(--c1);stroke-width:1.6}
.m-area.t2{fill:var(--c2);stroke:var(--c2)}
.m-area.t3{fill:var(--c3);stroke:var(--c3)}
.m-route{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.m-end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.m-lbl{fill:var(--txt);font-size:12px;font-weight:700;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.maplist{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
.maplist li{display:flex;gap:8px;align-items:baseline;padding:4px 0;color:var(--dim)}
.maplist .sw{width:11px;height:11px;border-radius:3px;flex:none;background:var(--c1);opacity:.75}
.maplist .sw.t2{background:var(--c2)} .maplist .sw.t3{background:var(--c3)}
.maplist b{color:var(--txt);font-weight:700;direction:ltr}
.mapnote{margin:9px 0 0;font-size:11.5px;color:var(--dim);line-height:1.45}

/* crew picker */
.picker{margin:0 15px 12px;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
.pk-h{font-size:13.5px;color:var(--dim);text-align:center;margin-bottom:8px}
.wheels{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:6px}
.wcol{display:flex;flex-direction:column;align-items:center;gap:5px}
.wl{font-size:11.5px;color:var(--dim)}
.wsep{font-size:24px;color:var(--dim);padding-bottom:52px;font-weight:300}
.wheel{position:relative;z-index:2;height:132px;width:84px;overflow-y:auto;scroll-snap-type:y mandatory;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 32%,#000 68%,transparent);
  mask-image:linear-gradient(180deg,transparent,#000 32%,#000 68%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel .sp{height:44px}
.wheel .it{height:44px;line-height:44px;scroll-snap-align:center;text-align:center;
  font-size:23px;font-variant-numeric:tabular-nums;color:var(--dim);cursor:pointer;transition:.15s}
.wheel .it.on{color:var(--txt);font-weight:800;font-size:26px}
.band{position:absolute;z-index:1;top:50%;transform:translateY(-50%);height:44px;inset-inline:14px;
  border-radius:9px;background:var(--tint);border:1px solid var(--tintbd);pointer-events:none}
.wheels .band{top:calc(50% + 9px)}
.pk-f{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:12px}
.pk-v{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;min-width:60px;
  text-align:center;direction:ltr}
.pk-f .btn-primary{padding:9px 22px;font-size:15px}
.pk-f .btn-primary:disabled{opacity:.45}
.pk-clr{padding:9px 14px;font-size:13.5px;border-radius:9px;background:var(--surface);
  border:1px solid var(--line);color:var(--dim)}
.chosen{margin:0 15px 12px;padding:10px 12px;border-radius:9px;background:var(--panel2);
  border:1px solid var(--line);color:var(--dim);font-size:13.5px;display:flex;align-items:center;
  gap:10px;flex-wrap:wrap}
.chosen b{color:var(--txt);font-size:15px}
.chosen .pk-clr{margin-inline-start:auto;padding:6px 12px}

/* ---- NOTAM ---- */
.sec-notam{padding-bottom:0}
.notam-bar{margin:0;border:0;border-bottom:1px solid var(--line2);border-radius:0;
  background:var(--panel2);padding:11px 15px;box-shadow:none}
.grp{margin:0}
.grp-h{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;padding:10px 15px;
  background:var(--panel2);border-top:1px solid var(--line2);border-bottom:1px solid var(--line)}
.grp-h .icao{font-size:21px;font-weight:800;letter-spacing:1px}
.grp-h .nm{font-size:13px;color:var(--dim);flex:1;min-width:120px}
.grp-h .role{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;
  padding:3px 10px;background:var(--panel2)}

.card{border-top:1px solid var(--line);background:var(--surface);padding-bottom:11px}
.card.t1{border-inline-start:5px solid var(--c1)}
.card.t2{border-inline-start:5px solid var(--c2)}
.card.t3{border-inline-start:5px solid var(--c3)}
.chead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:10px 15px 6px}
.tag{font-size:13px;font-weight:800;padding:3px 10px;border-radius:6px;white-space:nowrap}
.t1 .tag{color:var(--c1);background:var(--c1bg);border:1px solid var(--c1bd)}
.t2 .tag{color:var(--c2);background:var(--c2bg);border:1px solid var(--c2bd)}
.t3 .tag{color:var(--c3);background:var(--c3bg);border:1px solid var(--line)}
.nid{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums;direction:ltr}
.badge-new{font-size:11px;font-weight:800;color:#fff;background:var(--new);border-radius:5px;
  padding:3px 8px;letter-spacing:.4px}
.nhead{padding:0 15px 4px;font-size:15.5px;font-weight:700;direction:ltr;text-align:left;line-height:1.4}
.t1 .nhead{color:var(--c1)} .t2 .nhead{color:var(--c2)} .t3 .nhead{color:var(--txt)}
.gist{padding:0 15px 9px;direction:ltr;text-align:left;line-height:1.5;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;
  letter-spacing:.2px;word-break:break-word;color:var(--mono)}
.t1 .gist{font-weight:600}
.dates{padding:0 15px 8px;font-size:12.5px;color:var(--dim);direction:ltr;text-align:left;
  font-variant-numeric:tabular-nums}
.dates .exp{color:var(--c2)}
.rawbtn{margin:0 15px;padding:5px 11px;font-size:12.5px;border-radius:7px;background:var(--surface);
  border:1px solid var(--line);color:var(--dim)}
.raw{display:none;margin:9px 15px 0;padding:11px 12px;border-radius:8px;background:var(--panel2);
  border:1px solid var(--line);direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-word;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;color:var(--mono)}
.card.open .raw{display:block}
.empty{margin:0;padding:14px;color:var(--dim);font-size:13.5px;text-align:center;background:var(--panel2)}

.hidden{display:none}
.iconbtn{padding:7px 10px;font-size:15px;line-height:1;border-radius:9px}
header.bare .logo,header.bare .ver,header.bare #reset{display:none}
header.bare .hrow{padding:8px 14px}
footer{color:var(--dim);font-size:12px;text-align:center;padding:30px 0 24px}
</style>
</head>
<body>

<header id="hdr" class="bare">
  <div class="hrow">
    <span class="logo">FP Reader</span>
    <span class="ver" id="ver"></span>
    <span class="spacer"></span>
    <button id="theme" class="iconbtn" type="button" aria-label="מצב תצוגה"></button>
    <button id="reset">קובץ חדש</button>
  </div>
</header>

<div class="wrap">

  <section id="drop">
    <div class="hero">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="58" height="58">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#3fb950"/>
          </linearGradient></defs>
          <rect x="2" y="2" width="60" height="60" rx="16" fill="#111823" stroke="url(#g)" stroke-width="2"/>
          <rect x="14" y="17" width="36" height="5" rx="2.5" fill="#ff4d4f"/>
          <rect x="14" y="29" width="36" height="5" rx="2.5" fill="#ffa726"/>
          <rect x="14" y="41" width="22" height="5" rx="2.5" fill="#5b6976"/>
        </svg>
      </div>
      <h1 class="wordmark">FP<span>READER</span></h1>
      <div class="runway" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <p class="tag">עובר על תוכנית הטיסה כולה, בודק את הנתונים<br>ומתדרך על מה שחשוב</p>
    </div>

    <div class="dropzone" id="dz">
      <div class="dz-ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none"
             stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
